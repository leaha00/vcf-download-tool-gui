services:
  vcf-download-tool-gui:
    image: ghcr.io/leaha00/vcf-download-tool-gui:latest
    container_name: vcf-download-tool-gui
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - vcf-token:/data/token
      - vcf-depot:/mnt/vcf-depot
    environment:
      PORT: "8080"
      INTERNAL_PORT: "10080"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    networks:
      - vcf-shared
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1

networks:
  # Shared with vcf-web-depot's separate compose project so it can reach
  # this container's internal API by service name (vcf-download-tool-gui).
  # Fixed literal name (not external) - Compose creates it on first `up` if
  # it doesn't exist yet and just reuses it if it does, so whichever of the
  # two stacks (this one or vcf-web-depot's) deploys first creates it, no
  # manual `docker network create` step needed.
  vcf-shared:
    name: vcf-shared

volumes:
  vcf-token:
    driver: local

  vcf-depot:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.1.4,nolock,soft,rw"
      device: ":/mnt/Sol/General/vcf-depot"
