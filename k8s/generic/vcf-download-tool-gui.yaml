# VCF Download Tool GUI — Kubernetes deployment (generic / publishable variant).
#
# Equivalent to the repo's docker-compose.yml. Resources, in order: NFS
# PersistentVolume (cluster-scoped), ConfigMap, token + depot PVCs,
# Deployment, and two Services — a LoadBalancer for the web UI (port 80) and
# a ClusterIP for the internal depot API (10080, in-cluster consumers only).
#
# Before applying, review:
#   - the NFS server/path in the PersistentVolume (shared with the offline
#     depot; mounted as nfsvers=3 here, enforces root_squash) - it needs to permit
#     writes from a fixed UID/GID 1500 (or just be world-writable)
#
# Runs as a fixed non-root UID/GID (1500:1500) the whole way through here -
# no root, ever: the securityContext below sets runAsUser 1500 explicitly,
# so the container runtime starts the image's entrypoint directly as 1500,
# never as root. (The image's entrypoint *can* self-heal a stale-permission
# volume from an older version of this image when it does start as root -
# plain Docker/Compose with no user override - see entrypoint.sh and
# README.md "Upgrading from before v1.5.1.3"; that branch just never runs
# under this Deployment.) The CLI is uploaded through the GUI into the token
# volume — no bind mount, no second volume. See the repo's README.md.
#
# This file is the kustomize base. Deploy directly with:
#   kubectl apply -k k8s/generic/ -n <namespace>
#
# It sets NO fixed LoadBalancer address. The homelab overlay (k8s/homelab/)
# patches spec.loadBalancerIP onto the web UI Service; see the commented
# line on that Service.
---
# Static NFS PersistentVolume for the download depot. Cluster-scoped; the
# vcf-depot PVC below binds to it from its own side via spec.volumeName, so
# no claimRef is set here (a claimRef would pin the binding to one
# namespace). Same share the offline depot mounts, as nfsvers=3 (the homelab
# overlay switches to 4.1 - see k8s/homelab/nfs-csi-patch.yaml).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vcf-depot-nfs
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
    - nolock
    - soft
  nfs:
    server: 192.168.1.4
    path: /mnt/Sol/General/vcf-depot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vcf-download-tool-gui
data:
  PORT: "8080"
  INTERNAL_PORT: "10080"
  # Heap for the bundled-JRE CLI — it sets no -Xmx of its own, so without
  # this the JVM caps its heap at ~25% of the memory limit and CLI 9.1.1.0+
  # OOMs mid-download. Raise this and the Deployment memory limit together
  # if a newer CLI still OOMs.
  CLI_JAVA_TOOL_OPTIONS: "-Xmx768m"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vcf-token
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # Uses the cluster default StorageClass. Set storageClassName to pin one.
  # Holds the activation code, per-installation depot ID, the uploaded CLI,
  # job history and logs. App-managed — nothing to pre-populate.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vcf-depot
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
  storageClassName: ""
  volumeName: vcf-depot-nfs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcf-download-tool-gui
  labels:
    app: vcf-download-tool-gui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vcf-download-tool-gui
  template:
    metadata:
      labels:
        app: vcf-download-tool-gui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1500
        runAsGroup: 1500
        # Fresh PVCs (unlike a Docker named volume) don't inherit the
        # image's own chown - kubelet applies fsGroup to the mounted volume
        # itself, from outside the pod, so /data/token's PVC is group-
        # writable by 1500 on first mount without this container needing
        # any elevated capability to do it itself.
        fsGroup: 1500
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/leaha00/vcf-download-tool-gui:1.5.2
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vcf-download-tool-gui
          ports:
            - name: http
              containerPort: 8080
            - name: internal
              containerPort: 10080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: token
              mountPath: /data/token
            - name: depot
              mountPath: /mnt/vcf-depot
      volumes:
        - name: token
          persistentVolumeClaim:
            claimName: vcf-token
        - name: depot
          persistentVolumeClaim:
            claimName: vcf-depot
---
apiVersion: v1
kind: Service
metadata:
  name: vcf-download-tool-gui
  labels:
    app: vcf-download-tool-gui
spec:
  type: LoadBalancer
  # The k8s/homelab/ overlay patches this to ClusterIP and adds an Ingress.
  # Pin a fixed address on a plain LoadBalancer deploy by uncommenting:
  # loadBalancerIP: 192.168.20.41
  selector:
    app: vcf-download-tool-gui
  ports:
    - name: http
      port: 80
      # named container port "http" -> containerPort 8080 (ConfigMap PORT)
      targetPort: http
---
# Internal depot API — in-cluster only, never exposed. vcf-web-depot reaches
# it at http://vcf-download-tool-gui-internal:10080 (same namespace).
apiVersion: v1
kind: Service
metadata:
  name: vcf-download-tool-gui-internal
  labels:
    app: vcf-download-tool-gui
spec:
  type: ClusterIP
  selector:
    app: vcf-download-tool-gui
  ports:
    - name: internal
      port: 10080
      targetPort: internal
